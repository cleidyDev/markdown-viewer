name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
            flags: -tags webkit2_41
          - os: windows-latest
            name: windows-amd64
            flags: -platform windows/amd64
          - os: macos-latest
            name: macos-universal
            flags: -platform darwin/universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: $HOME/go/bin/wails build ${{ matrix.flags }}
        if: runner.os != 'Windows'

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;" + "$env:USERPROFILE\go\bin"
          wails build -platform windows/amd64

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/bin/*.exe dist/
          else
            cp build/bin/* dist/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-viewer-${{ matrix.name }}
          path: dist/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
